<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:white;
      padding:35px;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
      text-align:center;
      max-width:340px;
    }
    h2{margin-bottom:12px;color:#111827}
    p{color:#4b5563;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <h2>Thank You</h2>
    <p>The monitoring will start immediately.</p>
  </div>
</body>
</html>
